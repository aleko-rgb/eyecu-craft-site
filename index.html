<!doctype html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0e0e0e;--paper:#fff;--bg:#f4f1ec;--bordeaux:#6B1E2E;--bordeaux2:#7a2436;
  --gold:#A9805A;--grey:#767676;--line:rgba(0,0,0,.1);--ok:#2e7d32;--err:#b3261e;}
*{box-sizing:border-box}
body{margin:0;font-family:'Jost',-apple-system,Segoe UI,Arial,sans-serif;font-weight:300;color:var(--ink);
  background:radial-gradient(1100px 480px at 15% -10%,rgba(169,128,90,.07),transparent 60%),
    radial-gradient(900px 420px at 100% 0%,rgba(107,30,46,.05),transparent 55%),#f4f1ec;}
h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:500;margin:0}
a:focus-visible,button:focus-visible{outline:2px solid var(--bordeaux);outline-offset:3px}
.top{background:linear-gradient(180deg,var(--bordeaux2),var(--bordeaux));padding:14px 18px;display:flex;align-items:center}
.top img{height:34px;filter:brightness(0) invert(1)}
.wrap{max-width:720px;margin:0 auto;padding:18px}
.steps{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}
.stp{flex:1;min-width:110px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);border-top:2px solid var(--line);padding-top:7px}
.stp.on{color:var(--bordeaux);border-top-color:var(--bordeaux);font-weight:500}
.stp.done{color:var(--gold);border-top-color:var(--gold)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px;box-shadow:0 2px 10px rgba(14,14,14,.045)}
.card h3{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:20px;color:var(--bordeaux);margin:0 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.prodline{display:flex;gap:14px;align-items:center}
.prodline .thumb{width:62px;height:62px;border-radius:8px;flex:none;overflow:hidden;background:radial-gradient(130% 100% at 30% 20%,rgba(169,128,90,.22),transparent 60%),linear-gradient(160deg,#efe7dc,#e3d7c6);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--bordeaux)}
.prodline .thumb img{width:100%;height:100%;object-fit:cover}
.prodline .meta{flex:1}.prodline .pname{font-family:'Cormorant Garamond',serif;font-size:18px}
.prodline .pcol{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.prodline .pprice{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;color:var(--gold);font-size:20px;white-space:nowrap}
label{display:block;font-size:11px;color:var(--grey);margin:12px 0 5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
input,select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:6px;font-size:14px;background:#fdfcfb;font-family:'Jost',sans-serif;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);background:#fff;box-shadow:0 0 0 3px rgba(169,128,90,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.phonerow{display:flex;gap:8px}.phonerow select{flex:0 0 120px}
.btn{border:none;border-radius:6px;padding:13px 18px;font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;font-family:'Jost',sans-serif;transition:transform .12s,box-shadow .12s}
.btn-primary{background:linear-gradient(180deg,#7a2436,var(--bordeaux));color:#fff;box-shadow:0 3px 10px rgba(107,30,46,.25)}
.btn-primary:hover{box-shadow:0 5px 14px rgba(107,30,46,.32);transform:translateY(-1px)}
.btn-secondary{background:#fdfcfb;border:1px solid var(--bordeaux);color:var(--bordeaux)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.bar{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.drop{border:1px dashed var(--bordeaux);border-radius:8px;background:#fdfcfb;padding:28px 18px;text-align:center;color:var(--bordeaux);cursor:pointer}
.drop:hover{background:#fff}
.hint{font-size:12px;color:var(--grey);margin-top:8px}
.upok{font-size:17px;color:var(--ok);font-weight:500;margin-top:10px}
.warnbox{background:#fdf2f0;border:1px solid var(--err);color:#8a2b22;border-radius:8px;padding:10px 12px;font-size:13px;margin-top:10px}
.cropwrap{display:flex;flex-direction:column;align-items:center;gap:12px}
.stage{width:280px;height:280px;max-width:80vw;max-height:80vw;position:relative;border-radius:50%;overflow:hidden;background:#efe7dc;box-shadow:0 0 0 1px var(--line);touch-action:none;cursor:grab}
.stage.drag{cursor:grabbing}
.stage img{position:absolute;left:50%;top:50%;transform-origin:center;user-select:none;-webkit-user-drag:none;pointer-events:none}
.zoomrow{display:flex;align-items:center;gap:10px;width:280px;max-width:80vw}
.zoomrow input[type=range]{accent-color:var(--bordeaux)}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:14px;font-size:13px;color:var(--ink)}
.consent input{width:auto;margin-top:3px}
.note{background:#fdfaf0;border:1px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:13px;color:#5a4327;margin-top:12px;line-height:1.55}
.osum{background:#fdfcfb;border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:14px}
.osum .r{display:flex;justify-content:space-between;margin:4px 0}
.osum .r.tot{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.osum .r.tot b{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--gold);font-size:20px;font-weight:500}
.bank{font-size:14px;line-height:1.7}.bank b{color:var(--bordeaux)}
.ok{color:var(--ok)}
.spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="top"><img src="https://raw.githubusercontent.com/aleko-rgb/eyecu-pro-site/main/images/logo-v2.png" alt="EYE C U Iris Photo"></div>

<div class="wrap">
  <div class="steps">
    <div class="stp" data-s="upload"></div>
    <div class="stp" data-s="crop"></div>
    <div class="stp" data-s="checkout"></div>
  </div>

  <div class="card" id="prodCard">
    <div class="prodline">
      <div class="thumb" id="pThumb">EYE C U</div>
      <div class="meta"><div class="pcol" id="pCol"></div><div class="pname" id="pName"></div></div>
      <div class="pprice" id="pPrice"></div>
    </div>
    <div id="pickerWrap" class="hidden"><label data-t="pick_label"></label><select id="picker"></select></div>
  </div>

  <!-- 1. Upload -->
  <section class="card" data-stage="upload">
    <h3 data-t="s_upload"></h3>
    <div class="drop" id="drop">
      <div data-t="drop_title" style="font-size:16px"></div>
      <div class="hint" data-t="drop_hint"></div>
    </div>
    <input type="file" id="file" accept="image/*" class="hidden">
    <div id="upStatus" class="hint"></div>
    <div id="upWarn"></div>
    <div class="note" data-t="photo_notice"></div>
    <label class="consent"><input type="checkbox" id="photoConsent"><span data-t="photo_consent_txt"></span></label>
    <div class="bar"><span></span><button class="btn btn-primary" id="toCrop" disabled data-t="next"></button></div>
  </section>

  <!-- 2. Cadrage -->
  <section class="card hidden" data-stage="crop">
    <h3 data-t="s_crop"></h3>
    <div class="cropwrap">
      <div class="stage" id="stage"><img id="cropImg" alt=""></div>
      <div class="zoomrow"><span class="hint" data-t="zoom"></span><input type="range" id="zoom" min="1" max="4" step="0.01" value="1.3" style="flex:1"></div>
      <div class="hint" data-t="crop_hint"></div>
    </div>
    <div class="note" data-t="color_note"></div>
    <label class="consent"><input type="checkbox" id="consent"><span data-t="consent_txt"></span></label>
    <div class="bar"><button class="btn btn-secondary" data-back="upload" data-t="back"></button>
      <button class="btn btn-primary" id="toCheckout" disabled data-t="next"></button></div>
  </section>

  <!-- 3. Checkout -->
  <section class="card hidden" data-stage="checkout">
    <h3 data-t="s_checkout"></h3>
    <div class="osum" id="orderSummary"></div>
    <div class="row2">
      <div><label data-t="f_name"></label><input id="cName"></div>
      <div><label data-t="f_email"></label><input id="cEmail" type="email"></div>
    </div>
    <label data-t="f_phone"></label>
    <div class="phonerow"><select id="cPrefix"></select><input id="cPhone" inputmode="tel"></div>
    <label data-t="f_street"></label><input id="cStreet">
    <div class="row2">
      <div><label data-t="f_zip"></label><input id="cZip"></div>
      <div><label data-t="f_city"></label><input id="cCity"></div>
    </div>
    <div class="row2">
      <div><label data-t="f_country"></label><select id="cCountry"></select></div>
      <div><label data-t="f_qty"></label><input id="cQty" type="number" min="1" value="1"></div>
    </div>
    <label data-t="f_delivery"></label><select id="cDelivery"></select>
    <label class="consent" style="margin-top:14px"><input type="checkbox" id="isCompany"><span data-t="f_company_q"></span></label>
    <div id="companyFields" class="hidden">
      <div class="row2">
        <div><label data-t="f_company_name"></label><input id="coName"></div>
        <div><label data-t="f_company_vat"></label><input id="coVat"></div>
      </div>
      <label data-t="f_company_street"></label><input id="coStreet">
      <div class="row2">
        <div><label data-t="f_company_zip"></label><input id="coZip"></div>
        <div><label data-t="f_company_city"></label><input id="coCity"></div>
      </div>
      <label data-t="f_company_country"></label><input id="coCountry">
    </div>
    <div id="coError" class="warnbox hidden"></div>
    <div class="bar"><button class="btn btn-secondary" data-back="crop" data-t="back"></button>
      <button class="btn btn-primary" id="placeOrder" data-t="place_order"></button></div>
  </section>

  <!-- 4. Confirmation -->
  <section class="card hidden" data-stage="done">
    <h3 class="ok" data-t="s_done"></h3>
    <p data-t="done_intro"></p>
    <p style="font-size:18px"><b data-t="done_ref"></b> <span id="doneRef" class="serif" style="color:var(--bordeaux)"></span></p>
    <div class="note" data-t="done_bank_intro"></div>
    <div class="bank" id="bankBlock" style="margin-top:12px"></div>
    <p class="hint" id="doneMotif" style="margin-top:12px"></p>
  </section>
</div>

var STEP_LABELS={fr:["Photo","Cadrage","Commande"],en:["Photo","Framing","Order"],pl:["Zdjęcie","Kadr","Zamówienie"]};
function t(k){ return (TR[LANG]||TR.fr)[k]||k; }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

var product=INIT.product||(INIT.catalog&&INIT.catalog[0])||null;
var shipCountries=INIT.shipCountries||[];
var shipFees=INIT.shipFees||{};
var natW=0,natH=0,crop={zoom:1.3,offsetX:0,offsetY:0},fileId=null,lastDataUrl=null,uploaded=false;
var MAX_BYTES=35*1024*1024, MAX_PIXELS=40000000;

function applyT(){
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=t(el.getAttribute('data-t')); });
  var lbl=STEP_LABELS[LANG]||STEP_LABELS.fr;
  document.querySelectorAll('.stp').forEach(function(el,i){ el.textContent=('0'+(i+1))+'  '+lbl[i]; });
}
function priceVal(p){ return p&&p.price?(p.price[CUR]!=null?p.price[CUR]:p.price[Object.keys(p.price)[0]]):0; }
function fmt(n){ return Number(n).toLocaleString(CUR==='eur'?'fr-FR':'pl-PL')+' '+(CUR==='eur'?'€':'zł'); }

function renderProduct(){
  if(!product) return;
  document.getElementById('pCol').textContent=product.collection[LANG]||'';
  document.getElementById('pName').textContent=product.name[LANG]||'';
  document.getElementById('pPrice').textContent=fmt(priceVal(product));
  var th=document.getElementById('pThumb');
  if(product.image){ var im=new Image(); im.onload=function(){ th.innerHTML=''; th.appendChild(im); }; im.onerror=function(){ th.textContent='EYE C U'; }; im.alt=''; im.src=product.image; }
  else th.textContent='EYE C U';
}
function buildPicker(){
  if(product||!INIT.catalog) return;
  document.getElementById('pickerWrap').classList.remove('hidden');
  var sel=document.getElementById('picker');
  sel.innerHTML=INIT.catalog.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name[LANG])+' — '+fmt(priceVal(p))+'</option>';}).join('');
  product=INIT.catalog[0]; renderProduct();
  sel.addEventListener('change',function(){ product=INIT.catalog.filter(function(p){return p.id===sel.value;})[0]; shipFees=(INIT.shipFeesByProduct&&INIT.shipFeesByProduct[product.id])||shipFees; renderProduct(); });
}
function buildSelects(){
  document.getElementById('cPrefix').innerHTML=PREFIXES.map(function(p){return '<option'+(p==='+48'?' selected':'')+'>'+p+'</option>';}).join('');
  document.getElementById('cCountry').innerHTML='<option value="">'+esc(t('choose'))+'</option>'+shipCountries.map(function(c){return '<option value="'+esc(c)+'">'+esc(c)+'</option>';}).join('');
  document.getElementById('cDelivery').innerHTML='<option value="">'+esc(t('choose'))+'</option>'+
    '<option value="free_poznan">'+esc(t('opt_free'))+'</option>'+
    '<option value="ship">'+esc(t('opt_ship'))+'</option>';
}
function shipCost(){
  var d=document.getElementById('cDelivery').value, country=document.getElementById('cCountry').value;
  if(d==='free_poznan') return 0;
  if(d==='ship') return (shipFees[country]!=null)?shipFees[country]:null;
  return null;
}

function show(stage){
  document.querySelectorAll('[data-stage]').forEach(function(s){ s.classList.toggle('hidden', s.getAttribute('data-stage')!==stage); });
  var order=['upload','crop','checkout'], idx=order.indexOf(stage);
  document.querySelectorAll('.stp').forEach(function(el,i){ el.classList.toggle('on',i===idx); el.classList.toggle('done',idx>=0&&i<idx); });
  if(stage==='checkout') renderSummary();
  window.scrollTo(0,0);
}
function renderSummary(){
  var qty=Math.max(1,+document.getElementById('cQty').value||1), sub=priceVal(product)*qty, sc=shipCost();
  var tot=sub+(sc||0);
  document.getElementById('orderSummary').innerHTML=
    '<div class="r"><span>'+esc(t('sum_item'))+' — '+esc(product.name[LANG])+' × '+qty+'</span><span>'+fmt(sub)+'</span></div>'+
    '<div class="r"><span>'+esc(t('sum_ship'))+'</span><span>'+(sc!=null?fmt(sc):'—')+'</span></div>'+
    '<div class="r tot"><span>'+esc(t('sum_total'))+'</span><b>'+fmt(tot)+'</b></div>';
}

/* ---- UPLOAD ---- */
function normalizeToSRGB(file, cb){
  var img=new Image();
  img.onload=function(){
    var w=img.width,h=img.height;
    if(w*h>MAX_PIXELS){ cb(file,null,{raw:true}); return; }
    var c=document.createElement('canvas'); c.width=w; c.height=h;
    var x=c.getContext('2d',{colorSpace:'srgb'})||c.getContext('2d');
    x.drawImage(img,0,0,w,h);
    c.toBlob(function(b){ if(!b){ cb(file,null,{raw:true}); return; } cb(b, c.toDataURL('image/jpeg',0.92), {}); },'image/jpeg',0.92);
  };
  img.onerror=function(){ cb(null,null,{err:true}); };
  img.src=URL.createObjectURL(file);
}
function handleFile(file){
  if(!file) return;
  uploaded=false; fileId=null; updateToCrop();
  var warnEl=document.getElementById('upWarn'); warnEl.innerHTML='';
  if(file.size>MAX_BYTES){ warnEl.innerHTML='<div class="warnbox">'+esc(t('err_big'))+'</div>'; setStatus(''); return; }
  setStatus(t('up_reading'));
  normalizeToSRGB(file,function(blobOrFile,dataUrl,q){
    if(q.err){ warnEl.innerHTML='<div class="warnbox">'+esc(t('err_format'))+'</div>'; setStatus(''); return; }
    lastDataUrl=dataUrl;
    var im=document.getElementById('cropImg');
    im.onload=function(){ natW=im.naturalWidth; natH=im.naturalHeight; };
    im.src=dataUrl||URL.createObjectURL(file);
    setStatus(t('up_sending'));
    uploadBlob(blobOrFile,(file.name||'photo.jpg').replace(/\.[^.]+$/,'')+'.jpg',dataUrl,blobOrFile.type||'image/jpeg');
  });
}
function setStatus(txt){ var s=document.getElementById('upStatus'); s.textContent=txt; s.className='hint'; }
function uploadBlob(blob,name,dataUrl,mime){
  if(typeof google==='undefined'||!google.script){ setStatus('(mode démo : pas de serveur)'); fileId='DEMO'; doneUpload(); return; }
  google.script.run.withSuccessHandler(function(sess){
    fetch(sess.uploadUrl,{method:'PUT',body:blob}).then(function(r){return r.json();})
      .then(function(j){ if(j&&j.id){ fileId=j.id; doneUpload(); } else fallbackBase64(dataUrl,name); })
      .catch(function(){ fallbackBase64(dataUrl,name); });
  }).withFailureHandler(function(){ fallbackBase64(dataUrl,name); }).createUploadSession(name,mime||'image/jpeg');
}
function fallbackBase64(dataUrl,name){
  if(!dataUrl){ setStatus(t('up_fail')); return; }
  google.script.run.withSuccessHandler(function(res){ fileId=res.fileId; doneUpload(); })
    .withFailureHandler(function(){ setStatus(t('up_fail')); }).uploadBase64(dataUrl,name);
}
function doneUpload(){ var s=document.getElementById('upStatus'); s.textContent=t('up_done'); s.className='upok'; uploaded=true; updateToCrop(); }
function updateToCrop(){ document.getElementById('toCrop').disabled=!(uploaded && document.getElementById('photoConsent').checked); }

/* ---- CADRAGE ---- */
function place(S,nW,nH,f){ var cover=Math.max(S/nW,S/nH),sc=cover*f.zoom,dw=nW*sc,dh=nH*sc,ovx=Math.max(0,(dw-S)/2),ovy=Math.max(0,(dh-S)/2);
  return {dw:dw,dh:dh,ovx:ovx,ovy:ovy,tx:f.offsetX*ovx,ty:f.offsetY*ovy}; }
function renderCrop(){ var stage=document.getElementById('stage'),im=document.getElementById('cropImg'),S=stage.clientWidth; if(!natW) return;
  var p=place(S,natW,natH,crop); im.style.width=p.dw+'px'; im.style.height=p.dh+'px'; im.style.transform='translate(-50%,-50%) translate('+p.tx+'px,'+p.ty+'px)'; }
function initCrop(){
  var stage=document.getElementById('stage'),zoom=document.getElementById('zoom'),im=document.getElementById('cropImg');
  crop={zoom:parseFloat(zoom.value)||1.3,offsetX:0,offsetY:0};
  if(!natW && im.naturalWidth){ natW=im.naturalWidth; natH=im.naturalHeight; }
  im.onload=function(){ natW=im.naturalWidth; natH=im.naturalHeight; renderCrop(); };
  renderCrop();
  zoom.oninput=function(){ crop.zoom=parseFloat(zoom.value); clampOffsets(); renderCrop(); };
  var dragging=false,lx=0,ly=0;
  function down(e){ dragging=true; stage.classList.add('drag'); var pt=point(e); lx=pt.x; ly=pt.y; e.preventDefault(); }
  function move(e){ if(!dragging) return; var pt=point(e),S=stage.clientWidth,p=place(S,natW,natH,crop);
    if(p.ovx>0) crop.offsetX+=(pt.x-lx)/p.ovx; if(p.ovy>0) crop.offsetY+=(pt.y-ly)/p.ovy; lx=pt.x; ly=pt.y; clampOffsets(); renderCrop(); }
  function up(){ dragging=false; stage.classList.remove('drag'); }
  function point(e){ var t=e.touches?e.touches[0]:e; return {x:t.clientX,y:t.clientY}; }
  stage.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
  stage.addEventListener('touchstart',down,{passive:false}); stage.addEventListener('touchmove',move,{passive:false}); stage.addEventListener('touchend',up);
}
function clampOffsets(){ crop.offsetX=Math.max(-1,Math.min(1,crop.offsetX)); crop.offsetY=Math.max(-1,Math.min(1,crop.offsetY)); }

/* ---- CHECKOUT ---- */
function placeOrder(){
  var btn=document.getElementById('placeOrder'), err=document.getElementById('coError');
  function fail(m){ err.textContent=m; err.classList.remove('hidden'); }
  var name=val('cName'),email=val('cEmail');
  if(!name||!email) return fail(t('need_fields'));
  if(!val('cStreet')||!val('cZip')||!val('cCity')||!document.getElementById('cCountry').value) return fail(t('need_address'));
  var d=document.getElementById('cDelivery').value; if(!d) return fail(t('need_delivery'));
  if(d==='ship' && shipCost()==null) return fail(t('need_ship_country'));
  var company=null;
  if(document.getElementById('isCompany').checked){
    if(!val('coName')||!val('coVat')||!val('coStreet')||!val('coZip')||!val('coCity')||!val('coCountry')) return fail(t('need_company'));
    company={name:val('coName'),vat:val('coVat'),street:val('coStreet'),zip:val('coZip'),city:val('coCity'),country:val('coCountry')};
  }
  err.classList.add('hidden');
  var qty=Math.max(1,+document.getElementById('cQty').value||1);
  var payload={ lang:LANG, cur:CUR, consent:true, photoConsent:true, deliveryMethod:d,
    customer:{ name:name, email:email, phonePrefix:document.getElementById('cPrefix').value, phone:val('cPhone'),
      street:val('cStreet'), zip:val('cZip'), city:val('cCity'), country:document.getElementById('cCountry').value },
    company:company,
    items:[{ productId:product.id, qty:qty, cropJson:crop, fileId:(fileId==='DEMO'?'':fileId), side:'' }] };
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>'+t('sending');
  if(typeof google==='undefined'||!google.script){ showDone({orderRef:'DEMO-0000',bank:INIT.bank}); return; }
  google.script.run.withSuccessHandler(function(res){ showDone(res); })
    .withFailureHandler(function(e){ btn.disabled=false; btn.textContent=t('place_order'); fail((e&&e.message)||'Error'); })
    .submitOrder(payload);
}
function val(id){ return (document.getElementById(id).value||'').trim(); }
function showDone(res){
  show('done'); document.querySelector('[data-stage="done"]').classList.remove('hidden');
  document.getElementById('doneRef').textContent=res.orderRef||'';
  var b=res.bank||INIT.bank||{};
  document.getElementById('bankBlock').innerHTML='<div><b>'+esc(b.holder||'')+'</b></div><div>IBAN : <b>'+esc(b.iban||'—')+'</b></div><div>BIC : '+esc(b.bic||'—')+'</div>'+(b.bankName?'<div>'+esc(b.bankName)+'</div>':'');
  document.getElementById('doneMotif').textContent=t('done_motif')+' '+(res.orderRef||'');
  document.querySelectorAll('.stp').forEach(function(el){el.classList.add('done');el.classList.remove('on');});
}

/* ---- Wiring ---- */
applyT(); renderProduct(); buildPicker(); buildSelects();
document.getElementById('drop').addEventListener('click',function(){ document.getElementById('file').click(); });
document.getElementById('file').addEventListener('change',function(e){ handleFile(e.target.files[0]); });
document.getElementById('drop').addEventListener('dragover',function(e){e.preventDefault();});
document.getElementById('drop').addEventListener('drop',function(e){e.preventDefault(); handleFile(e.dataTransfer.files[0]);});
document.getElementById('photoConsent').addEventListener('change',updateToCrop);
document.getElementById('toCrop').addEventListener('click',function(){ show('crop'); initCrop(); });
document.getElementById('consent').addEventListener('change',function(e){ document.getElementById('toCheckout').disabled=!e.target.checked; });
document.getElementById('toCheckout').addEventListener('click',function(){ show('checkout'); });
document.getElementById('cQty').addEventListener('input',renderSummary);
document.getElementById('cDelivery').addEventListener('change',renderSummary);
document.getElementById('cCountry').addEventListener('change',renderSummary);
document.getElementById('isCompany').addEventListener('change',function(e){ document.getElementById('companyFields').classList.toggle('hidden',!e.target.checked); });
document.getElementById('placeOrder').addEventListener('click',placeOrder);
document.querySelectorAll('[data-back]').forEach(function(b){ b.addEventListener('click',function(){ show(b.getAttribute('data-back')); }); });
window.addEventListener('resize',function(){ if(!document.querySelector('[data-stage="crop"]').classList.contains('hidden')) renderCrop(); });
show('upload');
</script>
