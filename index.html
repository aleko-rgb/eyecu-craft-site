/* --- Helpers --- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* Prix : utilise le prix de la devise s'il existe, sinon convertit (indicatif ~). */
function priceIn(p,cur){
  if(p.price[cur]!=null) return {v:p.price[cur],approx:false};
  if(cur==='eur' && p.price.pln!=null) return {v:Math.round(p.price.pln/FX_EUR_PLN),approx:true};
  if(cur==='pln' && p.price.eur!=null) return {v:Math.round(p.price.eur*FX_EUR_PLN),approx:true};
  return {v:null,approx:false};
}
function fmtPrice(p){
  var c=CURRENCIES[CUR], r=priceIn(p,CUR);
  if(r.v==null) return "";
  return (r.approx?"~ ":"") + r.v.toLocaleString(c.loc) + " " + c.sym;
}

/* --- État : langue + devise (mémorisés) --- */
var LANG = "fr";
var CUR  = DEFAULT_CUR;
try{ var sl=localStorage.getItem('craft_lang'); if(sl&&TR[sl]) LANG=sl; }catch(e){}
try{ var sc=localStorage.getItem('craft_cur');  if(sc&&CURRENCIES[sc]) CUR=sc; }catch(e){}

/* --- Rendu du catalogue --- */
function renderProducts(){
  var g=document.getElementById('productGrid');
  g.innerHTML = PRODUCTS.map(function(p){
    var visual = p.image
      ? '<img src="'+esc(p.image)+'" alt="'+esc(p.name[LANG])+'">'
      : '<span class="mono">EYE C U</span>';
    return ''+
    '<article class="product">'+
      '<div class="ph">'+visual+'</div>'+
      '<div class="body">'+
        '<div class="collection">'+esc(p.collection[LANG])+'</div>'+
        '<h3>'+esc(p.name[LANG])+'</h3>'+
        '<p class="desc">'+esc(p.desc[LANG])+'</p>'+
        '<div class="foot">'+
          '<span class="price">'+fmtPrice(p)+'</span>'+
          '<button class="btn btn-solid" data-id="'+esc(p.id)+'">'+esc(TR[LANG].personalize)+'</button>'+
        '</div>'+
      '</div>'+
    '</article>';
  }).join('');
  g.querySelectorAll('.product .ph img').forEach(function(im){
    im.addEventListener('error',function(){ im.parentNode.innerHTML='<span class="mono">EYE C U</span>'; });
  });
  g.querySelectorAll('button[data-id]').forEach(function(b){
    b.addEventListener('click',function(){ openApp(b.getAttribute('data-id')); });
  });
}

/* --- Ouverture de l'app (étape 2). Tant que APP_URL est vide : message. --- */
function openApp(productId){
  if(!APP_URL){ alert(TR[LANG].app_soon); return; }
  window.location.href = APP_URL + (APP_URL.indexOf('?')>-1?'&':'?') +
    "product=" + encodeURIComponent(productId) +
    "&lang=" + LANG + "&cur=" + CUR;
}

/* --- Application de la langue à tout le DOM --- */
function applyAppLang(){
  var d=TR[LANG];
  document.querySelectorAll('[data-t]').forEach(function(el){
    var k=el.getAttribute('data-t'); if(d[k]!=null) el.innerHTML=d[k];
  });
  document.documentElement.lang=LANG;
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang')===LANG);
  });
  renderProducts();
}

/* --- Application de la devise --- */
function applyCurrency(){
  document.querySelectorAll('.cur button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-cur')===CUR);
  });
  renderProducts();
}

/* --- Catalogue live : lit le Sheet (tier B2C_2) via l'Apps Script, en JSONP.
      Si APP_URL est vide ou l'API injoignable => on garde le catalogue en dur. --- */
function loadCatalog(){
  if(!APP_URL) return;
  var cb='__craftCat_'+Date.now();
  var s=document.createElement('script');
  window[cb]=function(data){
    try{
      if(data && data.products && data.products.length){ PRODUCTS=data.products; renderProducts(); }
    }catch(e){}
    delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s);
  };
  s.onerror=function(){ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); };
  s.src=APP_URL+(APP_URL.indexOf('?')>-1?'&':'?')+"api=catalog&tier=B2C_2&callback="+cb;
  document.body.appendChild(s);
}
