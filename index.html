<style>
:root{
  --ink:#0e0e0e; --paper:#ffffff; --bg:#f4f1ec;
  --bordeaux:#6B1E2E; --bordeaux2:#7a2436;
  --gold:#A9805A; --grey:#767676; --line:rgba(0,0,0,0.1);
  --ok:#2e7d32; --err:#b3261e;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:'Jost',-apple-system,Segoe UI,Arial,sans-serif;font-weight:400;

h1,h2,h3,.serif{font-family:'Cormorant Garamond',serif;font-weight:500;margin:0}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
a:focus-visible,button:focus-visible{outline:2px solid var(--bordeaux);outline-offset:3px}

/* ---------- TOPBAR ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:40;
  background:transparent;box-shadow:none;transition:background .3s,box-shadow .3s;
}
.topbar.scrolled{
  background:linear-gradient(180deg,var(--bordeaux2),var(--bordeaux));
  box-shadow:0 2px 14px rgba(107,30,46,.22);
}
.topbar-inner{
  max-width:1200px;margin:0 auto;padding:0 6vw;height:64px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{display:flex;align-items:center;gap:12px;color:#fff}
.brand img{height:34px;filter:brightness(0) invert(1)}
.brand .wordmark{
  font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.28em;font-size:.82rem;
  text-transform:uppercase;color:#fff;white-space:nowrap;
}
.brand .craft{
  font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:500;
  letter-spacing:.02em;font-size:1.05rem;color:#f0d9b8;margin-left:2px;
}
.controls{display:flex;align-items:center;gap:12px}
.controls .sep{width:1px;height:20px;background:rgba(255,255,255,.28)}
.lang,.cur{display:flex;gap:6px}
.lang button,.cur button{
  background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;
  font-family:'Jost',sans-serif;font-size:11px;font-weight:500;letter-spacing:.06em;
  padding:5px 9px;border-radius:16px;cursor:pointer;transition:background .15s,border-color .15s;
  min-width:30px;
}
.lang button:hover,.cur button:hover{border-color:#fff}
.lang button.on,.cur button.on{background:#fff;color:var(--bordeaux);border-color:#fff}

/* ---------- HERO ---------- */
/* Photo affichée EN ENTIER (non recadrée), texte dans une bande sombre en dessous
   pour ne jamais couvrir les visages. Change l'URL de l'img pour une autre photo. */
.hero{position:relative;color:#fff;overflow:hidden;background:#140a0c}
/* hauteur plafonnée : on garde le haut (visages + colliers) et on coupe le bas.
   Ajuste object-position (ex. "center 10%") pour remonter/descendre le cadrage. */
.hero-photo{display:block;width:100%;height:clamp(380px,68vh,620px);overflow:hidden;background:#140a0c}
.hero-photo img{width:100%;height:100%;display:block;object-fit:cover;object-position:center top}
.hero-text{background:linear-gradient(160deg,#1a0a0e 0%,#3a1018 55%,#1c0b10 100%);padding:3rem 6vw 3.4rem}
.hero-inner{max-width:1200px;margin:0 auto;width:100%}
.hero .eyebrow{
  font-family:'Jost',sans-serif;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--gold);display:flex;align-items:center;gap:12px;margin-bottom:1rem;
}
.hero .eyebrow::before{content:'';width:34px;height:1px;background:var(--gold)}
.hero h1{font-size:clamp(2rem,5vw,3.8rem);line-height:1.05;max-width:20ch;margin-bottom:.4em;text-wrap:balance;text-transform:uppercase;letter-spacing:.01em}
.hero h1 em{font-style:normal;color:#f0d9b8}
.hero p{font-weight:300;font-size:clamp(1rem,2vw,1.15rem);max-width:52ch;color:rgba(255,255,255,.85);margin-bottom:1.8rem}
.hero .cta-row{display:flex;flex-wrap:wrap;gap:14px}

/* ---------- BUTTONS ---------- */
.btn{

  font-family:'Jost',sans-serif;font-size:13px;font-weight:500;letter-spacing:.1em;
  text-transform:uppercase;transition:transform .12s,box-shadow .12s,background .15s,color .15s;
}
.btn-solid{background:var(--bordeaux);color:#fff}
.btn-solid:hover{background:var(--bordeaux2);transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid currentColor;color:#fff}

.btn-gold{background:var(--gold);color:#fff}

.btn-white{background:#fff;color:var(--bordeaux)}

/* ---------- SECTION ---------- */

.group-title{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:1.6rem;color:var(--bordeaux);text-align:center;margin:2.4rem 0 1.2rem}
#productGrid .group-title:first-child{margin-top:0}
.product{
  background:var(--paper);border:1px solid var(--line);border-radius:2px;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(14,14,14,.045);
  transition:transform .18s,box-shadow .18s;
}
.product:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(14,14,14,.1)}
.product .ph{aspect-ratio:1/1;position:relative;overflow:hidden;background:#f4f1ec}
.product .track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none}
.product .track::-webkit-scrollbar{display:none}
.product .slide{flex:0 0 100%;height:100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center}
.product .slide img{width:100%;height:100%;object-fit:contain}
.product .ph .mono{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:2.4rem;color:var(--bordeaux);opacity:.5}
.product .dots{position:absolute;bottom:9px;left:0;right:0;display:flex;gap:6px;justify-content:center;pointer-events:none}
.product .dots span{width:6px;height:6px;border-radius:50%;background:rgba(14,14,14,.22);transition:background .15s}
.product .dots span.on{background:var(--bordeaux)}
.product .nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.88);border:1px solid var(--line);color:var(--bordeaux);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:18px;line-height:1;z-index:3;box-shadow:0 1px 5px rgba(0,0,0,.18);opacity:.5;transition:opacity .15s}
.product:hover .nav{opacity:1}
.product .nav.prev{left:8px}.product .nav.next{right:8px}
.product .count{position:absolute;top:9px;right:9px;background:rgba(14,14,14,.55);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px;z-index:3;letter-spacing:.02em}
@media(hover:none){.product .nav{opacity:1}}
.product .body{padding:18px 18px 20px;display:flex;flex-direction:column;flex:1}
.product .collection{

.product .desc{color:var(--grey);font-weight:300;font-size:.88rem;margin-bottom:14px;flex:1}

/* ---------- REASSURANCE ---------- */
.marks{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;max-width:960px;margin:0 auto}

.mark p{color:var(--grey);font-weight:300;font-size:.9rem;margin:0}

/* ---------- FOOTER ---------- */
footer{background:var(--ink);color:rgba(255,255,255,.72);padding:4rem 6vw 2.4rem}
.foot-grid{max-width:1200px;margin:0 auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:40px}
.foot-brand .wordmark{font-family:'Jost',sans-serif;font-weight:500;letter-spacing:.28em;font-size:.9rem;color:#fff;text-transform:uppercase}
.foot-brand p{font-weight:300;font-size:.88rem;max-width:34ch;margin:.8rem 0 0;color:rgba(255,255,255,.6)}
.foot-col h4{font-family:'Jost',sans-serif;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 .9rem;font-weight:500}
.foot-col a,.foot-col span{display:block;font-weight:300;font-size:.9rem;color:rgba(255,255,255,.72);margin-bottom:.5rem;transition:color .15s}
.foot-col a:hover{color:#fff}
.foot-bottom{max-width:1200px;margin:2.6rem auto 0;padding-top:1.6rem;border-top:1px solid rgba(255,255,255,.12);
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;font-size:.78rem;color:rgba(255,255,255,.45)}

/* ---------- RESPONSIVE ---------- */
@media(max-width:900px){
  .steps{grid-template-columns:1fr;gap:36px}
  .grid{grid-template-columns:repeat(2,1fr)}
  .marks{grid-template-columns:1fr;gap:30px}
}
@media(max-width:620px){
  .grid{grid-template-columns:1fr}
  .brand .wordmark{display:none}
  .topbar-inner{padding:0 5vw}
  section.block{padding:4rem 5vw}
}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important;scroll-behavior:auto!important}}

.note-modal{background:var(--bg);border:1px solid var(--line);border-radius:2px;padding:12px 14px;font-size:.85rem;color:var(--grey);margin-top:16px}
</style>

<script>
/* =======================================================================
   EYE C U Craft — vitrine statique (GitHub Pages)
   -----------------------------------------------------------------------
   Prix issus du Sheet Pricing, tier = B2C_2 (TTC, PLN). SKU = product_id.
   À RÉGLER :
   - APP_URL     → URL de la web app Apps Script (étape 2). Vide pour l'instant.
   - FX_EUR_PLN  → taux indicatif pour l'affichage "~ € " (aucun prix EUR figé
                   dans le tier B2C_2). Pour des prix EUR exacts, ajouter
                   price:{pln:269, eur:65} sur le produit voulu.
   - image:""    → mettre l'URL de la photo produit (sinon visuel placeholder).
   ======================================================================= */

var LOGO_URL   = "https://raw.githubusercontent.com/aleko-rgb/eyecu-pro-site/main/images/logo-v2.png";
var APP_URL    = "https://script.google.com/a/macros/eyecu-irisphoto.com/s/AKfycbwLnOBgaTOW8-utLP9UHTXvhe5Ol2spQjPR1cAFWQ6Jy4gUljGveV78pgUxxTjMC1k9/exec";        // URL /exec de la web app Apps Script. Sert l'app de perso
                            // ET le catalogue (?api=catalog). ex: "https://script.google.com/macros/s/XXXX/exec"
var FX_EUR_PLN = 4.30;      // taux PLN->EUR indicatif pour l'affichage

var CURRENCIES = {
  pln:{ sym:"zł", loc:"pl-PL" },  // zł — marché principal
  eur:{ sym:"€",  loc:"fr-FR" }   // €  — affichage converti (~) sauf prix EUR figé
};

/* --- Helpers --- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* Prix : utilise le prix de la devise s'il existe, sinon convertit (indicatif ~). */
function priceIn(p,cur){
  if(p.price[cur]!=null) return {v:p.price[cur],approx:false};
  if(cur==='eur' && p.price.pln!=null) return {v:Math.round(p.price.pln/FX_EUR_PLN),approx:true};
  if(cur==='pln' && p.price.eur!=null) return {v:Math.round(p.price.eur*FX_EUR_PLN),approx:true};
  return {v:null,approx:false};
}
function fmtPrice(p){
  var c=CURRENCIES[CUR], r=priceIn(p,CUR);
  if(r.v==null) return "";
  return (r.approx?"~ ":"") + r.v.toLocaleString(c.loc) + " " + c.sym;
}

/* --- Rendu du catalogue --- */
function renderProducts(){
  var g=document.getElementById('productGrid');
  function cardHtml(p){
    var photos = (p.photos&&p.photos.length)?p.photos:(p.image?[p.image]:[]);
    var slides = photos.length
      ? photos.map(function(src){ return '<div class="slide"><img src="'+esc(src)+'" alt="'+esc(p.name[LANG])+'"></div>'; }).join('')
      : '<div class="slide"><span class="mono">EYE C U</span></div>';
    var dots = photos.length>1 ? '<div class="dots">'+photos.map(function(_,i){ return '<span'+(i===0?' class="on"':'')+'></span>'; }).join('')+'</div>' : '';
    var nav = photos.length>1 ? '<button class="nav prev" data-dir="-1" aria-label="prev">‹</button><button class="nav next" data-dir="1" aria-label="next">›</button><div class="count">1/'+photos.length+'</div>' : '';
    return '<article class="product"><div class="ph"><div class="track">'+slides+'</div>'+nav+dots+'</div>'+
      '<div class="body"><div class="collection">'+esc(p.collection[LANG])+'</div><h3>'+esc(p.name[LANG])+'</h3>'+
      '<p class="desc">'+esc(p.desc[LANG])+'</p><div class="foot"><span class="price">'+fmtPrice(p)+'</span>'+
      '<button class="btn btn-solid" data-id="'+esc(p.id)+'">'+esc(TR[LANG].personalize)+'</button></div></div></article>';
  }
  function grp(p){ return p.group || (p.id.indexOf('S925')===0?'lila':(p.id.indexOf('Zn')===0?'acc':'sofia')); }
  var order=['sofia','lila','acc'], gl=GROUP_LABELS[LANG]||GROUP_LABELS.fr, html='';
  order.forEach(function(gk){
    var items=PRODUCTS.filter(function(p){ return grp(p)===gk; });
    if(!items.length) return;
    html += '<h3 class="group-title">'+esc(gl[gk])+'</h3><div class="grid">'+items.map(cardHtml).join('')+'</div>';
  });
  g.innerHTML = html;
  // image cassée -> placeholder sur ce slide
  g.querySelectorAll('.product .slide img').forEach(function(im){
    im.addEventListener('error',function(){ im.parentNode.innerHTML='<span class="mono">EYE C U</span>'; });
  });
  // flèches + points + compteur
  g.querySelectorAll('.product .ph').forEach(function(ph){
    var track=ph.querySelector('.track'), dots=ph.querySelectorAll('.dots span'),
        count=ph.querySelector('.count'), n=ph.querySelectorAll('.slide').length;
    ph.querySelectorAll('.nav').forEach(function(btn){
      btn.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation();
        track.scrollBy({left:(+btn.getAttribute('data-dir'))*track.clientWidth, behavior:'smooth'}); });
    });
    if(n<2) return;
    track.addEventListener('scroll',function(){
      var i=Math.round(track.scrollLeft/track.clientWidth);
      if(dots.length) dots.forEach(function(d,k){ d.classList.toggle('on',k===i); });
      if(count) count.textContent=(i+1)+'/'+n;
    },{passive:true});
  });
  g.querySelectorAll('button[data-id]').forEach(function(b){
    b.addEventListener('click',function(){ openApp(b.getAttribute('data-id')); });
  });
}

/* --- Ouverture de l'app (étape 2). Tant que APP_URL est vide : message. --- */
function openApp(productId){
  if(!APP_URL){ alert(TR[LANG].app_soon); return; }
  window.location.href = APP_URL + (APP_URL.indexOf('?')>-1?'&':'?') +
    "product=" + encodeURIComponent(productId) +
    "&lang=" + LANG + "&cur=" + CUR;
}
/* Ouvre l'app en mode "iris maison" (validation avant commande) */
function openAppIris(){
  if(!APP_URL){ alert(TR[LANG].app_soon); return; }
  window.location.href = APP_URL + (APP_URL.indexOf('?')>-1?'&':'?') +
    "mode=iris&lang=" + LANG + "&cur=" + CUR;
}

/* --- Application de la langue à tout le DOM --- */
function applyAppLang(){
  var d=TR[LANG];
  document.querySelectorAll('[data-t]').forEach(function(el){
    var k=el.getAttribute('data-t'); if(d[k]!=null) el.innerHTML=d[k];
  });
  document.documentElement.lang=LANG;
  document.querySelectorAll('.lang button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-lang')===LANG);
  });
  renderProducts();
}

/* --- Application de la devise --- */
function applyCurrency(){
  document.querySelectorAll('.cur button').forEach(function(b){
    b.classList.toggle('on', b.getAttribute('data-cur')===CUR);
  });
  renderProducts();
}

/* --- Catalogue live : lit le Sheet (tier B2C_2) via l'Apps Script, en JSONP.
      Si APP_URL est vide ou l'API injoignable => on garde le catalogue en dur. --- */
function loadCatalog(){
  if(!APP_URL) return;
  var cb='__craftCat_'+Date.now();
  var s=document.createElement('script');
  window[cb]=function(data){
    try{
      if(data && data.products && data.products.length){ PRODUCTS=data.products; renderProducts(); }
    }catch(e){}
    delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s);
  };
  s.onerror=function(){ delete window[cb]; if(s.parentNode) s.parentNode.removeChild(s); };
  s.src=APP_URL+(APP_URL.indexOf('?')>-1?'&':'?')+"api=catalog&tier=B2C_2&callback="+cb;
  document.body.appendChild(s);
}

/* --- Init --- */
document.querySelectorAll('[data-logo]').forEach(function(img){ img.src=LOGO_URL; });
document.getElementById('year').textContent = new Date().getFullYear();

document.querySelectorAll('.lang button').forEach(function(b){
  b.addEventListener('click',function(){
    LANG=b.getAttribute('data-lang');
    try{ localStorage.setItem('craft_lang',LANG); }catch(e){}
    applyAppLang();
  });
});
document.querySelectorAll('.cur button').forEach(function(b){
  b.addEventListener('click',function(){
    CUR=b.getAttribute('data-cur');
    try{ localStorage.setItem('craft_cur',CUR); }catch(e){}
    applyCurrency();
  });
});

/* --- Topbar : transparente sur le hero, bordeaux au défilement (comme le site pro) --- */
var _topbar=document.querySelector('.topbar');
function onScroll(){ _topbar.classList.toggle('scrolled', window.scrollY>60); }
window.addEventListener('scroll',onScroll,{passive:true}); onScroll();

/* --- Pop-up guide iris --- */
function buildIrisSteps(){
  var ol=document.getElementById('irisSteps'); if(!ol) return;
  var s=(TR[LANG]||TR.fr).iris_steps||[];
  ol.innerHTML=s.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('');
}
var irisModal=document.getElementById('irisModal');
document.getElementById('irisOpen').addEventListener('click',function(){ buildIrisSteps(); irisModal.hidden=false; });
document.getElementById('irisStart').addEventListener('click',openAppIris);
document.getElementById('irisClose').addEventListener('click',function(){ irisModal.hidden=true; });
irisModal.addEventListener('click',function(e){ if(e.target===irisModal) irisModal.hidden=true; });
document.addEventListener('keydown',function(e){ if(e.key==='Escape') irisModal.hidden=true; });

applyAppLang();
applyCurrency();
loadCatalog();   // catalogue live depuis le Sheet (via Apps Script) ; sinon catalogue en dur
</script>
</body>
